[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-file-tools"
version = "0.1.0"
description = "Local-first, zero-dependency Python CLI for file deduplication, organization and batch renaming"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "scweos"}
]
keywords = ["file", "dedup", "organize", "rename", "cli", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
escape-files = "escape_file_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["escape_file_tools*"]
